<!--
  CONTENT CARD - not a full document. The page background, this card, the brand
  bar and the footer are all assembled by buildEmailDocument() in
  server/utils/emailTemplates.js.

  Style tokens (shared with the footer):
    brand #00629b | ink #1f2933 | muted #667482 | hairline #e6eaee | panel #f0f6fb
    heading 15px/21px bold | body 13px/20px | small 11px/18px | caps 10px/15px
-->

<!-- ==================== INTRO ==================== -->
<tr>
  <td style="padding: 28px 25px 0 25px;">
    <div
      style="
        color: #1f2933;
        font-size: 18px;
        line-height: 25px;
        font-weight: 700;
      "
    >
      Verify your email
    </div>
    <p
      style="
        margin: 8px 0 0;
        color: #667482;
        font-size: 13px;
        line-height: 20px;
      "
    >
      Use the verification code below to confirm your email address.
    </p>
  </td>
</tr>

<!-- ==================== OTP CODE ==================== -->
<tr>
  <td style="padding: 20px 25px 0 25px;">
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="100%"
      style="
        background-color: #f0f6fb;
        border: 1px dashed #00629b;
      "
    >
      <tr>
        <td align="center" style="padding: 22px 20px;">
          <div
            style="
              color: #00629b;
              font-size: 32px;
              line-height: 40px;
              font-weight: 700;
              letter-spacing: 10px;
              font-family: 'Courier New', Courier, monospace;
            "
          >
            {{otpCode}}
          </div>
        </td>
      </tr>
    </table>
  </td>
</tr>

<!-- ==================== NOTES ==================== -->
<tr>
  <td style="padding: 18px 25px 28px 25px;">
    <p
      style="
        margin: 0 0 6px;
        color: #667482;
        font-size: 11px;
        line-height: 18px;
      "
    >
      This code will expire in <strong style="color: #344454;">10 minutes</strong>.
    </p>
    <p
      style="
        margin: 0;
        color: #667482;
        font-size: 11px;
        line-height: 18px;
      "
    >
      If you didn&rsquo;t request this, you can safely ignore this email.
    </p>
  </td>
</tr>
