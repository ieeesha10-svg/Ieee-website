<!--
  CONTENT CARD - not a full document. The page background, this card, the brand
  bar and the footer are all assembled by buildEmailDocument() in
  server/utils/emailTemplates.js.

  Style tokens (shared with the footer):
    brand #00629b | ink #1f2933 | muted #667482 | hairline #e6eaee | panel #f0f6fb
    heading 15px/21px bold | body 13px/20px | small 11px/18px | caps 10px/15px
-->

<!-- ==================== DECISION BANNER ==================== -->
<tr>
  <td
    align="center"
    style="
      padding: 18px 25px;
      background-color: {{bannerBg}};
    "
  >
    <div
      style="
        color: #ffffff;
        font-size: 16px;
        line-height: 22px;
        font-weight: 700;
      "
    >
      {{bannerTitle}}
    </div>
  </td>
</tr>

<!-- ==================== GREETING ==================== -->
<tr>
  <td style="padding: 24px 25px 0 25px;">
    <p
      style="
        margin: 0 0 14px;
        color: #1f2933;
        font-size: 13px;
        line-height: 20px;
      "
    >
      Hi <strong>{{userName}}</strong>,
    </p>
    <p
      style="
        margin: 0;
        color: #1f2933;
        font-size: 13px;
        line-height: 20px;
      "
    >
      {{message}}
    </p>
  </td>
</tr>

<!-- ==================== COMMITTEE ==================== -->
<tr>
  <td style="padding: 18px 25px 0 25px;">
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="100%"
      style="
        background-color: {{panelBg}};
        border-left: 3px solid {{bannerBg}};
      "
    >
      <tr>
        <td style="padding: 12px 16px;">
          <p
            style="
              margin: 0;
              color: #667482;
              font-size: 11px;
              line-height: 18px;
            "
          >
            Committee: <strong style="color: #1f2933;">{{committeePosition}}</strong>
          </p>
        </td>
      </tr>
    </table>
  </td>
</tr>

<!-- ==================== CLOSING ==================== -->
<tr>
  <td style="padding: 18px 25px 28px 25px;">
    <p
      style="
        margin: 0 0 6px;
        color: #667482;
        font-size: 13px;
        line-height: 20px;
      "
    >
      Should you have any questions, please do not hesitate to contact us.
    </p>
    <p
      style="
        margin: 0;
        color: #1f2933;
        font-size: 13px;
        line-height: 20px;
      "
    >
      Best regards,<br />IEEE SHA Team
    </p>
  </td>
</tr>
