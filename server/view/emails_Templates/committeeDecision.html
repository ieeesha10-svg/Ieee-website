<!DOCTYPE html>
<html>
<body style="margin: 0; padding: 0; background-color: #f4f4f5; font-family: Arial, Helvetica, sans-serif;">
  <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);">
    <div style="background-color: #00629B; padding: 22px 28px; text-align: center;">
      <h1 style="margin: 0; color: #ffffff; font-size: 20px; letter-spacing: 1px;">IEEE El Shorouk Academy</h1>
      <p style="margin: 4px 0 0; color: #bfe0f5; font-size: 12px; letter-spacing: 2px;">STUDENT BRANCH</p>
    </div>

    <div style="background-color: {{bannerBg}}; color: #ffffff; padding: 20px 28px; text-align: center;">
      <h2 style="margin: 0; font-size: 22px;">{{bannerTitle}}</h2>
    </div>

    <div style="padding: 32px 28px; color: #333333;">
      <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.6;">Dear <strong>{{userName}}</strong>,</p>
      <p style="margin: 0 0 20px; font-size: 15px; line-height: 1.6;">{{message}}</p>

      <div style="margin: 0 0 20px; padding: 14px 18px; background-color: {{panelBg}}; border-left: 4px solid {{bannerBg}}; border-radius: 8px;">
        <p style="margin: 0; font-size: 14px; color: #555555;">Committee: <strong>{{committeePosition}}</strong></p>
      </div>

      <p style="margin: 0 0 8px; font-size: 14px; color: #555555; line-height: 1.6;">Should you have any questions, please do not hesitate to contact us.</p>
      <p style="margin: 0; font-size: 14px; color: #555555;">Best regards,<br>IEEE SHA Team</p>
    </div>
  </div>
</body>
</html>
