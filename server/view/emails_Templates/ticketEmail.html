<!--
  CONTENT CARD - not a full document. The page background, this card, the brand
  bar and the footer are all assembled by buildEmailDocument() in
  server/utils/emailTemplates.js.

  Style tokens (shared with the footer):
    brand #00629b | ink #1f2933 | muted #667482 | hairline #e6eaee | panel #f0f6fb
    heading 15px/21px bold | body 13px/20px | small 11px/18px | caps 10px/15px

  NOTE: submissionController.js currently keeps the QR ticket email commented
  out, so this template is not sent. It is kept in step with the rest so
  re-enabling the ticket flow needs no restyling.
-->

<!-- ==================== INTRO ==================== -->
<tr>
  <td style="padding: 28px 25px 0 25px;">
    <div
      style="
        color: #1f2933;
        font-size: 18px;
        line-height: 25px;
        font-weight: 700;
      "
    >
      Registration confirmed
    </div>
    <p
      style="
        margin: 8px 0 0;
        color: #667482;
        font-size: 13px;
        line-height: 20px;
      "
    >
      Hi <strong>{{userName}}</strong>, your registration for
      <strong style="color: #1f2933;">{{eventTitle}}</strong> is confirmed.
    </p>
  </td>
</tr>

<!-- ==================== TICKET ==================== -->
<tr>
  <td style="padding: 20px 25px 0 25px;">
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="100%"
      style="
        background-color: #f7f9fb;
        border: 1px solid #e0e7ee;
      "
    >
      <tr>
        <td align="center" style="padding: 22px 20px;">
          <img
            src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&amp;data={{ticketCode}}"
            alt="Ticket QR code"
            width="160"
            style="
              display: block;
              width: 160px;
              max-width: 160px;
              height: auto;
              border: 0;
              outline: none;
              text-decoration: none;
            "
          />
          <div
            style="
              margin-top: 14px;
              color: #667482;
              font-size: 10px;
              line-height: 15px;
              font-weight: 700;
              letter-spacing: 1px;
            "
          >
            TICKET ID
          </div>
          <div
            style="
              margin-top: 4px;
              color: #00629b;
              font-size: 15px;
              line-height: 21px;
              font-weight: 700;
              font-family: 'Courier New', Courier, monospace;
            "
          >
            {{ticketCode}}
          </div>
        </td>
      </tr>
    </table>
  </td>
</tr>

<!-- ==================== CLOSING ==================== -->
<tr>
  <td style="padding: 18px 25px 28px 25px;">
    <p
      style="
        margin: 0 0 6px;
        color: #667482;
        font-size: 13px;
        line-height: 20px;
      "
    >
      Please bring this QR code with you, as it is required for entry at the event.
    </p>
    <p
      style="
        margin: 0;
        color: #1f2933;
        font-size: 13px;
        line-height: 20px;
      "
    >
      Best regards,<br />IEEE SHA Team
    </p>
  </td>
</tr>
